name: Release Publish

on:
  push:
    tags:
      - '@dfosco/tiny-canvas@*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Package tag (for example, @dfosco/tiny-canvas@0.1.0)'
        required: true

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci --legacy-peer-deps

      - name: Validate release
        id: release
        run: |
          VERSION=$(node -p "require('./packages/tiny-canvas/package.json').version")
          TAG="@dfosco/tiny-canvas@${VERSION}"
          REQUESTED_TAG="${{ github.event.inputs.tag || github.ref_name }}"

          if [ "$REQUESTED_TAG" != "$TAG" ]; then
            echo "Expected tag $TAG, received $REQUESTED_TAG" >&2
            exit 1
          fi

          npm run build
          npm run build:demo

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish package to npm
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          PUBLISHED=$(npm view "@dfosco/tiny-canvas@${VERSION}" version 2>/dev/null || true)

          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "@dfosco/tiny-canvas@${VERSION} is already published"
          else
            npx --yes npm@11 publish \
              --workspace @dfosco/tiny-canvas \
              --access public \
              --provenance \
              --tag latest
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
            exit 0
          fi

          NOTES=$(awk -v version="## ${VERSION}" \
            '$0 == version { found=1; next } found && /^## / { exit } found { print }' \
            packages/tiny-canvas/CHANGELOG.md)

          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" |
              gh release create "$TAG" --title "v${VERSION}" --notes-file - --latest
          else
            gh release create "$TAG" --title "v${VERSION}" --generate-notes --latest
          fi
